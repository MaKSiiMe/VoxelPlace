name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lint:
    name: Lint backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm install

      # no-undef attrape les identifiants utilisés sans import — la classe de
      # bug qui a mis l'API à terre (verifyToken appelé sans être importé).
      - name: ESLint
        run: npm run lint:backend

  test-backend:
    name: Tests backend
    runs-on: ubuntu-latest

    # Les tests tournent contre un vrai PostgreSQL, à la version de production :
    # les requêtes analytiques (LAG OVER, date_trunc, INTERVAL) ne sont pas
    # reproductibles avec un émulateur en mémoire.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     voxelplace
          POSTGRES_PASSWORD: voxelplace
          POSTGRES_DB:       postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxelplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/socket-server
        run: npm install

      - name: Run backend tests
        working-directory: apps/socket-server
        run: npm test
        env:
          BCRYPT_ROUNDS:     1
          TEST_DATABASE_URL: postgresql://voxelplace:voxelplace@localhost:5432/postgres

  test-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm install --workspace=apps/web

      - name: Run frontend tests
        run: npm test --workspace=apps/web

      # Le build production type-check l'app, ce que les tests ne font pas.
      # Sans cette étape, une erreur TypeScript passe la CI, fait échouer le
      # build Docker sur le serveur, et l'ancienne image continue de tourner.
      - name: Build frontend
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost

  deploy:
    name: Deploy
    needs: [lint, test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy app + plugin
        uses: appleboy/ssh-action@v1
        with:
          host: 100.124.153.20
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RCON_PASSWORD
          script: |
            # -e : sans cela, un échec de "docker compose build" laissait
            # "docker compose up -d" relancer l'image précédente, et le
            # déploiement était rapporté comme réussi.
            # Pas de pipefail : "git diff | grep -q" ci-dessous fait sortir
            # git sur SIGPIPE, ce qui ferait échouer la détection du plugin.
            set -eu
            cd /opt/voxelplace
            git fetch origin
            git reset --hard origin/main
            docker compose build voxelplace-api voxelplace-web
            docker compose up -d
            docker image prune -f
            if git diff HEAD@{1} HEAD --name-only | grep -q '^apps/game-bridges/minecraft/'; then
              mvn -f apps/game-bridges/minecraft/pom.xml clean package -q
              # "sudo cp" vers le volume échouait : le shell SSH n'est pas un
              # terminal, sudo ne peut pas demander de mot de passe. Sans set -e
              # l'échec passait inaperçu et le plugin n'était jamais mis à jour.
              # docker cp écrit dans le conteneur sans privilèges élevés.
              MC_DEST=$(docker inspect minecraft-paper \
                --format '{{range .Mounts}}{{if eq .Name "minecraft-server_mc_data"}}{{.Destination}}{{end}}{{end}}' || true)
              MC_DEST=${MC_DEST:-/data}
              docker cp apps/game-bridges/minecraft/target/VoxelPlace.jar \
                "minecraft-paper:${MC_DEST}/plugins/VoxelPlace.jar"
              docker restart minecraft-paper
              echo "[deploy] Plugin Minecraft mis à jour."
            else
              echo "[deploy] Aucun changement Minecraft, redémarrage ignoré."
            fi
        env:
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
